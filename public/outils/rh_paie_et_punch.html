<!doctype html><html lang="fr"><head>
<script src="/outils/pont.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ANRO · La paie et le punch, pas à pas</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;800&display=swap" rel="stylesheet"><style>
:root{--charbon:#0F0A0A;--foyer:#4A1620;--braise:#2F0D14;--bg:#FAF7F7;--card:#fff;--ink:#0F0A0A;--line:#E4D9DB;--muted:#6E6464;--ok:#1F7A4D;--red:#C0262D;--scr:#F3F5F4;--qb:#2CA01C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140D0E;--card:#1E1416;--ink:#F4EEEF;--line:#3A2A2D;--muted:#B3A6A8;--ok:#3FB37A;--scr:#24191B}}
:root[data-theme="dark"]{--bg:#140D0E;--card:#1E1416;--ink:#F4EEEF;--line:#3A2A2D;--muted:#B3A6A8;--ok:#3FB37A;--scr:#24191B}
*{box-sizing:inherit}html,body{height:100%}body{margin:0;font-family:"Fira Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{background:radial-gradient(120% 140% at 85% 0%,var(--foyer),var(--braise) 55%,var(--charbon));color:#fff;padding:16px 18px 12px}
header h1{margin:0;font-size:21px;font-weight:800}header .p{font-weight:300;opacity:.9;font-size:14px;margin-top:2px}
.dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}.dots span{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}.dots span.on{background:#fff}.dots span.done{background:#3FB37A}
main{flex:1;overflow:auto;max-width:720px;width:100%;margin:0 auto;padding:14px 16px 20px}
.part{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}h2{font-size:24px;font-weight:800;margin:4px 0 12px}
.alert{background:var(--red);color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;margin-bottom:12px;font-size:16px}
/* écran simulé */
.dev{background:var(--charbon);border-radius:22px;padding:10px;margin-bottom:14px}.scr{background:var(--scr);border-radius:14px;overflow:hidden;min-height:210px;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}.top i{width:22px;height:22px;border-radius:6px;background:var(--qb);display:inline-block}
.body{display:flex}.side{width:34%;padding:8px;border-right:1px solid var(--line);background:var(--card)}.side div{padding:7px 8px;border-radius:8px;font-size:12.5px;margin-bottom:3px;color:var(--muted)}
.side div.hl{background:var(--foyer);color:#fff;font-weight:600;animation:glow 1.6s infinite}.side div.past{color:var(--ink);font-weight:600}
.mainp{flex:1;padding:10px;font-size:12.5px}.row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.row.hl{border:2px solid var(--foyer);animation:glow 1.6s infinite}.row b{font-weight:600}.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--qb);color:#fff;white-space:nowrap}.pill.off{background:var(--line);color:var(--muted)}
.btnm{display:inline-block;background:var(--qb);color:#fff;border-radius:8px;padding:7px 12px;font-weight:600;position:relative}
.tapdot{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(244,238,239,.9);border:3px solid var(--foyer);pointer-events:none;animation:tap 1.4s ease-in-out infinite;right:-10px;bottom:-12px}
@keyframes tap{0%,60%,100%{transform:scale(1);opacity:.95}30%{transform:scale(.55);opacity:1}}@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(74,22,32,.5)}50%{box-shadow:0 0 0 6px rgba(74,22,32,0)}}
.ipad{display:grid;place-items:center;min-height:210px;gap:8px;padding:16px;text-align:center}.pin{display:flex;gap:8px}.pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--foyer)}.pin span.f{background:var(--foyer);animation:fill 2s infinite}
@keyframes fill{0%,20%{background:transparent}30%,100%{background:var(--foyer)}}
.keys{display:grid;grid-template-columns:repeat(3,44px);gap:6px}.keys b{height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:600}
.flow{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:18px 8px;flex-wrap:wrap}.fl{flex:1;min-width:70px;text-align:center;font-size:12px}.fl .ic{font-size:30px;display:block;margin-bottom:4px;animation:bob 2.4s infinite}.fl:nth-child(3) .ic{animation-delay:.6s}.fl:nth-child(5) .ic{animation-delay:1.2s}.fl:nth-child(7) .ic{animation-delay:1.8s}.arr{color:var(--muted);font-size:18px}
@keyframes bob{0%,100%{transform:translateY(0)}15%{transform:translateY(-6px)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px;font-size:11px;text-align:center}.cal b{color:var(--muted);font-weight:600}.cal span{padding:8px 0;border-radius:8px;background:var(--card);border:1px solid var(--line)}.cal span.m{background:var(--foyer);color:#fff;font-weight:700;animation:glow 1.6s infinite}.cal span.t{background:var(--red);color:#fff;font-weight:700}.cal span.j{background:var(--ok);color:#fff;font-weight:700}
.leg{display:flex;gap:10px;justify-content:center;font-size:12px;padding:0 10px 12px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* checklist */
.chk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 12px;margin-bottom:12px}.ci{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px;font-weight:300;line-height:1.4}.ci:last-child{border:0}.ci b{font-weight:600}
.bx{width:28px;height:28px;flex:none;border-radius:8px;border:2.5px solid var(--foyer);display:grid;place-items:center;color:#fff;font-weight:800}.ci.on .bx{background:var(--ok);border-color:var(--ok)}.ci.on span{color:var(--muted)}
.tip{font-size:14px;color:var(--muted);margin:0 2px 12px}
.cam{width:100%;min-height:52px;border-radius:12px;border:2px dashed var(--foyer);background:transparent;color:var(--ink);font:800 16px "Fira Sans";cursor:pointer}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:15px "Fira Sans";background:var(--card);color:var(--ink);margin-top:8px}#ans{white-space:pre-wrap;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
footer{display:flex;gap:10px;padding:10px 16px;max-width:720px;width:100%;margin:0 auto}footer button{flex:1;min-height:56px;border-radius:14px;font:800 17px "Fira Sans";cursor:pointer}#prev{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}#next{background:var(--ok);color:#fff;border:0;flex:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><h1>💵 La paie et le punch, pas à pas</h1><div class="p">Coche chaque ligne quand c'est fait. L'élément qui clignote, c'est là que tu touches.</div><div class="dots" id="dots"></div></header>
<main id="m"></main><footer><button id="prev">← Retour</button><button id="next">Suivant →</button></footer>
<input type="file" id="ph" accept="image/*" capture="environment" hidden>
<script>
const QB=(side,hl,rows,btn)=>`<div class="dev"><div class="scr"><div class="top"><i></i>QuickBooks</div><div class="body"><div class="side">${side.map((s,i)=>`<div class="${i===hl?'hl':i<hl?'past':''}">${s}</div>`).join('')}</div><div class="mainp">${rows.map(r=>`<div class="row ${r[2]?'hl':''}"><span><b>${r[0]}</b></span>${r[1]}</div>`).join('')}${btn?`<div style="text-align:right;margin-top:8px"><span class="btnm">${btn}<span class="tapdot"></span></span></div>`:''}</div></div></div></div>`;
const P=t=>`<span class="pill">${t}</span>`,O=t=>`<span class="pill off">${t}</span>`;
const S=[
{p:"Comprendre",t:"Le cycle de paie",v:`<div class="dev"><div class="scr"><div class="flow"><div class="fl"><span class="ic">⏱️</span>Ils punchent sur la tablette</div><span class="arr">›</span><div class="fl"><span class="ic">✅</span>Lundi 19 h : tu approuves</div><span class="arr">›</span><div class="fl"><span class="ic">🏦</span>Mercredi : QuickBooks prélève</div><span class="arr">›</span><div class="fl"><span class="ic">💸</span>Jeudi : ils sont payés</div></div></div></div>`,c:["Les heures arrivent toutes seules du punch.","Toi, tu approuves et tu soumets : <b>5 minutes</b>.","Le jeudi matin, l'argent est dans leur compte, avec le talon par courriel."]},
{p:"Comprendre",t:"La limite à ne jamais dépasser",v:`<div class="alert">⏰ Mardi 20 h (heure de Montréal) = dernière minute pour une paie le jeudi.</div><div class="dev"><div class="scr"><div class="cal"><b>L</b><b>M</b><b>M</b><b>J</b><b>V</b><b>S</b><b>D</b><span class="m">19 h</span><span class="t">20 h</span><span>prélève</span><span class="j">PAIE</span><span>·</span><span>·</span><span>·</span></div><div class="leg"><span><i style="background:var(--foyer)"></i>Ton rendez-vous</span><span><i style="background:var(--red)"></i>Limite</span><span><i style="background:var(--ok)"></i>Paie</span></div></div></div>`,c:["Dépôt direct en 2 jours : soumettre avant <b>17 h heure du Pacifique</b>, 2 jours bancaires avant. Pour nous : <b>mardi 20 h</b>.","Ton rendez-vous du lundi 19 h te donne une journée de coussin.","<b>Semaine avec un férié</b> : soumets une journée plus tôt.","Une fois soumise, la paie ne s'annule plus."]},
{p:"Comprendre",t:"Les DAS, en clair",v:`<div class="dev"><div class="scr"><div class="flow"><div class="fl"><span class="ic">🇨🇦</span><b>ARC</b><br>impôt fédéral, AE</div><span class="arr">+</span><div class="fl"><span class="ic">⚜️</span><b>Revenu Québec</b><br>impôt QC, RRQ, RQAP, FSS</div><span class="arr">=</span><div class="fl"><span class="ic">🧮</span><b>QuickBooks calcule tout</b></div></div></div></div>`,c:["Les DAS = ce qu'on retient sur la paie <b>+ la part d'ANRO</b> (AE ×1,4, RRQ égal, RQAP ×1,4, FSS).","On les paie en général <b>au plus tard le 15 du mois suivant</b>, à l'ARC et à Revenu Québec, séparément.","Une fois par année : les normes du travail (CNT). À part : la CNESST."]},
{p:"Setup de la paie",t:"Vérifier le calendrier de paie",v:QB(["Tableau de bord","Ventes","Dépenses","Paie","⚙️ Paramètres"],4,[["Calendrier de paie",P("Aux 2 semaines"),1],["Jour de paie",P("Jeudi"),1],["Prochaine date de paie",O("à lire"),1]]),c:["Ouvre <b>QuickBooks › Paie</b>, puis la <b>roue dentée ⚙️</b>.","Vérifie : <b>Aux deux semaines · jeudi</b>.","Lis la <b>prochaine date de paie</b> et dis-la-moi dans la conversation."],tip:"Je vérifie que ton rendez-vous du lundi tombe la bonne semaine."},
{p:"Setup de la paie",t:"Le dépôt direct",v:QB(["Tableau de bord","Paie","⚙️ Paramètres","Dépôt direct"],3,[["Compte d'ANRO",P("Relié"),1],["Délai",P("2 jours"),1],["Limite par paie",O("plus haut que ta paie"),1]]),c:["Paramètres de paie › <b>Dépôt direct</b>.","Le <b>compte bancaire d'ANRO</b> est relié.","Le délai est <b>2 jours</b>. Avec Premium ou Elite, 1 jour est possible : la limite devient mercredi.","La <b>limite</b> dépasse le total d'une paie."]},
{p:"Setup de la paie",t:"Les employés",v:QB(["Paie","Employés"],1,[["Frédéric Paquette",P("25 $/h"),0],["Sébastien Fortin",P("23 $/h"),0],["Iris Besneux",P("22 $/h"),0],["Ketya Babin",P("20 $/h"),0],["Amélie Boulé",P("18 $/h"),1]]),c:["Le <b>taux horaire</b> de chacun est bon.","Le <b>dépôt direct</b> de chaque employé est entré.","Les <b>TD1</b> et <b>TP-1015.3</b> sont remplis.","Chaque employé a son <b>courriel</b> pour le talon."],tip:"Angelica et Rey sont sous-traitants : ils facturent, ils ne sont pas dans la paie."},
{p:"Setup de la paie",t:"Les DAS automatiques",v:QB(["Paie","⚙️ Paramètres","Taxes et formulaires"],2,[["Numéro ARC (RP0001)",P("✓"),0],["Numéro Revenu Québec (RS0001)",P("✓"),0],["Fréquence de versement",O("mensuelle ?"),0],["Payer et produire automatiquement",O("Activer"),1]]),c:["Ouvre <b>Taxes et formulaires</b>.","Tes numéros <b>ARC</b> et <b>Revenu Québec</b> sont entrés.","Note ta <b>fréquence de versement</b>.","Si ton forfait l'offre : active <b>Payer et produire automatiquement</b>."],tip:"Pas l'option ? QuickBooks › Paie › Taxes de paie › Payer : un clic par mois avant le 15."},
{p:"Setup de la paie",t:"L'approbation des heures",v:QB(["QuickBooks Time","⚙️ Paramètres","Approbations"],2,[["Seules les heures approuvées vont à la paie",P("Activé"),1],["Rappel d'oubli de punch",P("Activé"),1]]),c:["Ouvre <b>QuickBooks Time › Paramètres › Approbations</b>.","Active : <b>seules les heures approuvées vont à la paie</b>.","Active les <b>rappels d'oubli de punch</b>."]},
{p:"Punch sur les tablettes",t:"Activer le kiosque",v:QB(["QuickBooks Time","⚙️ Paramètres","Kiosque","Équipe"],2,[["Kiosque",P("Activé"),1],["NIP par employé",O("à créer"),1],["Photo au punch",O("si offert"),0]]),c:["QuickBooks Time › Paramètres › <b>Kiosque</b> › active-le.","Donne un <b>NIP</b> à chaque employé (Équipe › employé).","Si c'est offert, active la <b>photo au punch</b>."]},
{p:"Punch sur les tablettes",t:"Installer sur chaque tablette",v:`<div class="dev"><div class="scr ipad"><b style="font-size:15px">QuickBooks Time Kiosk</b><div class="pin"><span class="f"></span><span class="f"></span><span></span><span></span></div><div class="keys"><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b></div></div></div>`,c:["Sur chaque iPad : App Store › <b>QuickBooks Time Kiosk</b>.","Connecte-toi avec <b>ton compte administrateur</b>, une seule fois.","Bloque l'iPad sur l'app : <b>Réglages › Accessibilité › Accès guidé</b>, puis triple-clic sur le bouton du haut › Démarrer."],tip:"Postes : e-commerce, entrepôt et broderie, presse, caisse de la boutique."},
{p:"Punch sur les tablettes",t:"Tester",v:`<div class="dev"><div class="scr ipad"><div style="font-size:40px;animation:bob 2s infinite">👆</div><b>Entre ton NIP › Entrée</b><span style="color:var(--muted);font-size:13px">1 minute plus tard › Sortie</span></div></div>`,c:["Punche avec <b>ton NIP</b> : Entrée.","Une minute plus tard : Sortie.","Dans QuickBooks Time, la ligne <b>apparaît</b>."],tip:"Le 12 octobre, montre-le à l'équipe : NIP, Entrée, Pause, Sortie."},
{p:"Ta routine",t:"Le lundi de paie, 5 minutes",v:`<div class="alert">🔴 Lundi 19 h · ne jamais déplacer</div>`+QB(["QuickBooks Time","Feuilles de temps","Paie","Lancer la paie"],3,[["Heures approuvées",P("✓"),0],["Totaux vérifiés",P("✓"),0]],"Soumettre"),c:["<b>QuickBooks Time</b> › Feuilles de temps › corrige les oublis › <b>Approuver tout</b>.","<b>Paie › Lancer la paie</b>.","Vérifie les heures et les totaux.","Touche <b>Soumettre</b>. Jeudi, tout le monde est payé."],tip:"Chaque mois avant le 15 : un coup d'œil pour confirmer que les DAS sont payés."}];
let k=0,D={};try{k=+localStorage.getItem('anro_paie2_k')||0;D=JSON.parse(localStorage.getItem('anro_paie2_d')||'{}')}catch(e){}let sample=null,caps=null;
const $=s=>document.getElementById(s);
function save(){try{localStorage.setItem('anro_paie2_k',k);localStorage.setItem('anro_paie2_d',JSON.stringify(D))}catch(e){}}
function full(i){return S[i].c.every((_,j)=>D[i+'-'+j])}
function r(){k=Math.max(0,Math.min(S.length-1,k));save();const s=S[k];
$('dots').innerHTML=S.map((_,i)=>`<span class="${i===k?'on':full(i)?'done':''}"></span>`).join('');
$('m').innerHTML=`<div class="part">Étape ${k+1} sur ${S.length} · ${s.p}</div><h2>${s.t}</h2>${s.v}<div class="chk">${s.c.map((c,j)=>`<div class="ci ${D[k+'-'+j]?'on':''}" data-j="${j}"><div class="bx">${D[k+'-'+j]?'✓':''}</div><span>${c}</span></div>`).join('')}</div>${s.tip?`<p class="tip">💡 ${s.tip}</p>`:''}${caps&&caps.images?`<button class="cam" id="cam">📷 Je bloque : photo de mon écran</button><textarea id="q" placeholder="Ta question (facultatif)"></textarea><div id="ans" style="display:none"></div>`:''}`;
$('prev').style.visibility=k?'visible':'hidden';$('next').textContent=k===S.length-1?'🎉 Terminé':(full(k)?'✓ Fait, suivant':'Suivant →');$('m').scrollTop=0}
document.addEventListener('click',e=>{const ci=e.target.closest('.ci');if(ci){const id=k+'-'+ci.dataset.j;D[id]=!D[id];const y=$('m').scrollTop;r();$('m').scrollTop=y;return}
 const b=e.target.closest('button');if(!b)return;if(b.id==='next'){if(k<S.length-1){k++;r()}else b.textContent='🎉 Ta paie est prête !';return}if(b.id==='prev'){k--;r();return}if(b.id==='cam')$('ph').click()});
$('ph').addEventListener('change',async()=>{const f=$('ph').files[0];if(!f||!sample)return;const s=S[k],q=($('q')&&$('q').value)||"Qu'est-ce que je dois faire ?";$('ans').style.display='block';$('ans').textContent='Je regarde ta photo…';
 try{await sample(`Tu aides Julien, propriétaire d'ANRO (Québec), à configurer QuickBooks Online Paie et QuickBooks Time. Il est à l'étape « ${s.t} ». Voici la photo de son écran. Sa question : ${q}\nRéponds en français québécois, tutoiement, très court : où toucher ou quoi vérifier, en 1 à 4 étapes numérotées. Si l'écran ne correspond pas à l'étape, dis-lui où aller.`,{images:[f],modelTier:'default',onText:({text})=>{$('ans').textContent=text}})}catch(x){$('ans').textContent=x.code==='not_granted'?'Accès refusé. Envoie la photo dans la conversation.':'Erreur. Envoie la photo dans la conversation.'}$('ph').value=''});
r();(async()=>{try{sample=await claude.use('sample');if(sample)caps=await sample.limits().catch(()=>null)}catch(e){}r()})();
</script></body></html>
