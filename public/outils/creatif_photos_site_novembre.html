<!doctype html>
<html lang="fr"><head>
<script src="/outils/pont.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANRO · Photos du site de novembre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--charbon:#0F0A0A;--coton:#FFFFFF;--foyer:#4A1620;--braise:#2F0D14;--bg:#F4F1EF;--card:#FFFFFF;--ink:#0F0A0A;--mute:#6B6262;--line:#E4DCDA;--ok:#1F7A3E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0A0A;--card:#1A1213;--ink:#FFFFFF;--mute:#B8AEAE;--line:#3A2A2D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0A0A;--card:#1A1213;--ink:#FFFFFF;--mute:#B8AEAE;--line:#3A2A2D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 140px}
header.top{background:var(--charbon);color:#fff;padding:22px 16px 26px;margin:0 -16px 18px}
.brand{font-weight:900;letter-spacing:-.02em;font-size:22px}.brand span{display:inline-block;width:14px;height:14px;background:var(--foyer);margin-left:6px;transform:rotate(45deg)}
h1{font-size:34px;line-height:1;font-weight:900;margin:14px 0 8px;text-transform:uppercase;letter-spacing:-.02em}
.lead{margin:0;color:#D9CFCF;font-size:15px;line-height:1.45}
.prog{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:1.5px;color:#C9B6B9;text-transform:uppercase}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 18px;overflow:hidden}
.bh{padding:16px 16px 6px;display:flex;gap:12px;align-items:flex-start}
.num{flex:0 0 34px;height:34px;border-radius:8px;background:var(--charbon);color:#fff;font-weight:900;display:grid;place-items:center}
:root[data-theme="dark"] .num{background:var(--foyer)}
.bh h2{margin:2px 0 4px;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.2px}
.bh p{margin:0;color:var(--mute);font-size:14px;line-height:1.4}
.preview{margin:12px 16px 0;border-radius:10px;overflow:hidden;position:relative;background:#222}
.pv-hero{aspect-ratio:16/9}.pv-mob{aspect-ratio:4/5;max-width:300px;margin-left:auto;margin-right:auto;border:6px solid #111;border-radius:26px}
.pv-band{aspect-ratio:21/9}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72));display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
.ov small{font-size:9px;font-weight:700;letter-spacing:1.6px}.ov b{font-size:22px;line-height:.98;font-weight:900;text-transform:uppercase;margin:4px 0 8px}
.pv-hero .ov b{font-size:28px}.ov .btns{display:flex;gap:6px}.ov .btns i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:1.2px;padding:7px 10px;background:#fff;color:#0F0A0A}.ov .btns i+i{background:transparent;color:#fff;border:1px solid #fff}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:14px;text-align:center;padding:20px}
.lbl{margin:14px 16px 8px;font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--mute);text-transform:uppercase}
.opts{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.opt{flex:0 0 108px;scroll-snap-align:start;border:2px solid transparent;border-radius:10px;padding:0;background:none;cursor:pointer;color:var(--ink);text-align:left;font:inherit}
.opt .th{width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#333;position:relative}
.opt .th img{width:100%;height:100%;object-fit:cover;display:block}
.opt .cap{display:block;font-size:11px;line-height:1.25;padding:5px 2px 2px;color:var(--mute)}
.opt.on{border-color:var(--foyer)}.opt.on .cap{color:var(--ink);font-weight:600}
.opt .tag{position:absolute;top:6px;left:6px;background:var(--foyer);color:#fff;font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 6px;border-radius:4px}
.opt.none .th{display:grid;place-items:center;color:#bbb;font-size:12px;text-align:center;padding:8px}
.why{margin:10px 16px 0;font-size:13px;line-height:1.45;color:var(--mute)}
.why b{color:var(--ink)}
.dec{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px 16px}
.dec button{font:inherit;font-weight:800;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;padding:14px 8px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.dec .ok.on{background:var(--ok);border-color:var(--ok);color:#fff}.dec .ch.on{background:var(--foyer);border-color:var(--foyer);color:#fff}
textarea{display:none;margin:0 16px 16px;width:calc(100% - 32px);min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
textarea.show{display:block}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--charbon);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:10}
.bar button,.bar label{font:inherit;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.cam{flex:0 0 auto;padding:0 16px;background:transparent;border:2px solid #5A3A40;color:#fff;font-size:13px}
.send{flex:1;padding:16px;background:#fff;color:#0F0A0A;border:0;font-size:14px}
.send:disabled{opacity:.6}
.msg{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;padding:14px;border-radius:10px;font-size:14px;font-weight:600;display:none;z-index:11}
.msg.err{background:var(--foyer)}
.camthumb{margin:0 0 18px;display:none}.camthumb img{max-width:100%;border-radius:10px}
</style></head><body>
<div class="wrap">
<header class="top"><div class="brand">ANRO<span></span></div>
<h1>Les photos du site de novembre</h1>
<p class="lead">Touche une photo pour la voir en vrai dans le bloc. Mes choix sont déjà sélectionnés. Pour chaque bloc : Approuver ou À changer, puis Envoyer en bas.</p>
<div class="prog" id="prog">0 bloc sur 4 décidé</div></header>
<div id="blocks"></div>
<div class="camthumb" id="camthumb"><div class="lbl" style="margin-left:0">📷 Photo jointe</div><img id="camimg" alt="Photo jointe"></div>
