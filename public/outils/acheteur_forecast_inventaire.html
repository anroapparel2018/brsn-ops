<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANRO · Forecast inventaire</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0F0A0A;--card:#1A1213;--line:#3A2A2C;--txt:#F4EEEE;--mut:#B9AFAF;--gold:#C9A227;--ok:#4CC37E;--chg:#D46A7E}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F5F1F0;--card:#fff;--line:#E4DCDA;--txt:#0F0A0A;--mut:#6E6464;--gold:#8A6D0F;--ok:#1E8A50;--chg:#4A1620}}
:root[data-theme="light"]{--bg:#F5F1F0;--card:#fff;--line:#E4DCDA;--txt:#0F0A0A;--mut:#6E6464;--gold:#8A6D0F;--ok:#1E8A50;--chg:#4A1620}
:root[data-theme="dark"]{--bg:#0F0A0A;--card:#1A1213;--line:#3A2A2C;--txt:#F4EEEE;--mut:#B9AFAF;--gold:#C9A227;--ok:#4CC37E;--chg:#D46A7E}
*{box-sizing:inherit}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Fira Sans',system-ui,sans-serif}
body>*{max-width:900px;margin-left:auto;margin-right:auto}
.hero{background:linear-gradient(160deg,#4A1620,#2F0D14 55%,#0F0A0A);color:#fff;padding:28px 18px 24px;margin-bottom:14px}
.logo{width:150px;max-width:100%;display:block;margin-bottom:18px}
.eye{color:#C9A227;font-size:11px;font-weight:800;letter-spacing:2.5px;margin:0 0 8px}
h1{font-size:40px;font-weight:900;line-height:.95;letter-spacing:-.02em;margin:0 0 10px}
.sub{font-size:15px;line-height:1.45;opacity:.9;margin:0}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 12px 14px}
.blk.ok{border-color:var(--ok)}.blk.chg{border-color:var(--chg)}
.k{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800;text-transform:uppercase}
h2{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:4px 0 10px}
p{font-size:14.5px;line-height:1.55;margin:8px 0}.note{font-size:12.5px;color:var(--mut)}
.zone{border-top:1px solid var(--line);padding:10px 0}.zone p{margin:4px 0 0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:-1px}
#three{width:100%;height:340px;border-radius:12px;overflow:hidden;background:#0B0707;touch-action:none}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend button{font-size:12px;padding:6px 10px;border-radius:999px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tr.cat td{color:var(--gold);font-weight:800;padding-top:14px}
.tot{font-size:20px;font-weight:900}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button,.cam{font-family:inherit;font-size:14px;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer}
.cam input{display:none}
button.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}button.on-chg{background:var(--chg);border-color:var(--chg);color:#fff}
textarea{width:100%;font-family:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--txt);padding:8px;margin-top:8px;min-height:60px;display:none}
#sum{display:block;min-height:140px}#camprev{max-width:100%;border-radius:10px;margin-top:10px;display:none}
.sum{margin-bottom:40px}
.btns button.on[data-a="ok"]{background:var(--ok);border-color:var(--ok);color:#fff}.btns button.on[data-a="chg"]{background:var(--chg);border-color:var(--chg);color:#fff}
.send{background:var(--gold)!important;border-color:var(--gold)!important;color:#0F0A0A!important;font-weight:800;font-size:16px!important;padding:14px 24px!important}
</style></head><body>
