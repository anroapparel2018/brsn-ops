<!doctype html><html lang="fr"><head>
<script src="/outils/pont.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MusiquePlus × ANRO — Quantités et PO</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,600;0,800;1,300&display=swap" rel="stylesheet">
<style>
:root{--charbon:#0F0A0A;--coton:#FFFFFF;--foyer:#4A1620;--braise:#2F0D14;--line:rgba(255,255,255,.14);--mute:rgba(255,255,255,.62);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--charbon);color:var(--coton);font-family:'Fira Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 80px}
header{padding:22px 0 16px;border-bottom:1px solid var(--line)}
header img{height:30px}
h1{font-weight:800;font-size:clamp(26px,6vw,38px);line-height:1.05;margin:18px 0 6px}
h2{font-size:22px;font-weight:800;margin:34px 0 12px}
.sub{color:var(--mute);margin:0}
.tabs{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;background:none;color:var(--mute);border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:#fff;border-color:#fff}
.pane{display:none}.pane.on{display:block}
.sizes{background:var(--braise);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.sizes h3{margin:0 0 4px;font-size:17px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.grid7 label{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px}
.grid7 input{width:100%;font:inherit;font-size:17px;font-weight:600;text-align:center;padding:10px 0;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--charbon);color:#fff}
.tot{margin-top:12px;font-size:14px;color:var(--mute)}.tot b{color:#fff;font-size:17px}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px}
.card svg{width:100%;height:auto;background:#1a1414;border-radius:10px}
.card h4{margin:10px 0 2px;font-size:17px}
.card .num{color:var(--mute);font-weight:400}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:13.5px}
.card dt{color:var(--mute)}.card dd{margin:0}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(255,255,255,.4)}
.warn{color:#f0c35a}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12.5px}
tr.sum td{font-weight:800}
.po{background:var(--coton);color:var(--charbon);border-radius:12px;padding:22px;margin:16px 0;page-break-after:always}
.po .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--charbon);padding-bottom:12px}
.po .head img{height:26px;filter:brightness(0)}
.po h3{margin:14px 0 4px;font-size:20px}
.po small{color:#555}
.po th,.po td{border-bottom:1px solid #ddd}.po th{color:#555}
.po .bar{height:10px;border-radius:3px;margin:6px 0 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button.b{font:inherit;font-weight:600;border-radius:10px;padding:11px 16px;border:1px solid #fff;background:#fff;color:var(--charbon);cursor:pointer}
button.g{background:transparent;color:#fff;border-color:var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media print{body{background:#fff}.wrap>*:not(#poOut){display:none!important}#poOut{display:block!important}.po{border-radius:0;margin:0;padding:0 0 20px}}
</style></head><body><div class="wrap">
